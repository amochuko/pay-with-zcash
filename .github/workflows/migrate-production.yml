name: Production Database Migrations

on:
    workflow_dispatch: # The `workflow_dispatch` trigger means you can initiate the workflow manually from GitHub Actions. It does not automatically run on every push.

permissions:
    contents: read

concurrency:
    group: production-database-migrations
    cancel-in-progress: false

jobs:
    migrate:
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Set up Node.js
              uses: actions/setup-node@v5
              with:
                  node-version: 22

            - name: Install dependencies
              run: npm ci

            - name: Run production migrations
              run: npm run migrate-db
              env:
                  NODE_ENV: production
                  DATABASE_URL: ${{secrets.DATABASE_URL}}
                  DB_SCHEMA: ${{vars.DB_SCHEMA}}
                  migrationPath: ${{secrets.MIGRATION_PATH}}
